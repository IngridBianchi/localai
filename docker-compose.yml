version: "3.9"

services:
  localai:
    image: quay.io/go-skynet/local-ai:latest
    container_name: localai
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    environment:
      THREADS: "2"
      CONTEXT_SIZE: "4096"
      TIMEOUT: "600"
      NO_GALLERY: "true"
      PRELOAD_MODELS: '[{"url":"file:///models/phi3.yaml"}]'
    # Si querés limitar recursos en tu PC, usá esto en lugar de deploy:
    # mem_limit: 6g
    # cpus: 2

  webhook:
    build: .
    container_name: sophie_webhook
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      VERIFY_TOKEN: "sophie_verify_token"
      PAGE_ACCESS_TOKEN: "your_page_access_token"
    depends_on:
      - localai
